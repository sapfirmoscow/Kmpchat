name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку/PR отменяет предыдущий прогон.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew :shared:allTests :shared:testAndroidHostTest :androidApp:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  desktop:
    name: Desktop build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Собирает приложение вместе с урезанным JRE (jlink) — проверяет и компиляцию,
      # и упаковку. Установщики (msi/dmg/deb) здесь не нужны: их собирают только на целевой ОС.
      - name: Create desktop distributable
        run: ./gradlew :desktopApp:createDistributable
